name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: github.repository_owner == 'simpsonm09-org' || github.repository_owner == 'simpsonm09-projects'
    uses: simpsonm09-projects/repo-standard/.github/workflows/lint.yml@34941736aa4de7d634376043ae80527c3bfc76ea # repo-standard main
  aislop:
    if: github.repository_owner == 'simpsonm09-org' || github.repository_owner == 'simpsonm09-projects'
    permissions:
      contents: read
      security-events: write
    uses: simpsonm09-projects/repo-standard/.github/workflows/aislop.yml@34941736aa4de7d634376043ae80527c3bfc76ea # repo-standard main
  security:
    if: github.repository_owner == 'simpsonm09-org' || github.repository_owner == 'simpsonm09-projects'
    permissions:
      contents: read
      security-events: write
    uses: simpsonm09-projects/repo-standard/.github/workflows/security.yml@34941736aa4de7d634376043ae80527c3bfc76ea # repo-standard main

  standard:
    if: github.repository_owner == 'simpsonm09-org' || github.repository_owner == 'simpsonm09-projects'
    permissions:
      contents: read
    uses: simpsonm09-projects/repo-standard/.github/workflows/standard.yml@34941736aa4de7d634376043ae80527c3bfc76ea # repo-standard main

  test:
    if: github.repository_owner == 'simpsonm09-org' || github.repository_owner == 'simpsonm09-projects'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
      - name: Check the workspace wiring
        run: just test
      - name: Check the non-Windows supervised runner guard
        run: node --test --test-name-pattern="public lifecycle run refuses non-Windows" scripts/local-model.test.mjs

  local-model-windows:
    if: github.repository_owner == 'simpsonm09-org' || github.repository_owner == 'simpsonm09-projects'
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Require PowerShell 7
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion.Major -lt 7) {
            throw "PowerShell 7 or newer is required; found $($PSVersionTable.PSVersion)."
          }
      - name: Run the local model lifecycle tests
        run: node --test --test-concurrency=1 scripts/local-model.test.mjs
