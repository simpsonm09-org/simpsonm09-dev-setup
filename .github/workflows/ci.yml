name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    uses: simpsonm09-org/simpsonm09-repo-standard/.github/workflows/lint.yml@ca6555b8e6bc16a78ea0b6eeeeee1e5c0a527c57 # repo-standard main
  aislop:
    permissions:
      contents: read
      security-events: write
    uses: simpsonm09-org/simpsonm09-repo-standard/.github/workflows/aislop.yml@ca6555b8e6bc16a78ea0b6eeeeee1e5c0a527c57 # repo-standard main
  security:
    permissions:
      contents: read
      security-events: write
    uses: simpsonm09-org/simpsonm09-repo-standard/.github/workflows/security.yml@ca6555b8e6bc16a78ea0b6eeeeee1e5c0a527c57 # repo-standard main

  standard:
    permissions:
      contents: read
    uses: simpsonm09-org/simpsonm09-repo-standard/.github/workflows/standard.yml@ca6555b8e6bc16a78ea0b6eeeeee1e5c0a527c57 # repo-standard main

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
      - name: Check the workspace wiring
        run: just test
