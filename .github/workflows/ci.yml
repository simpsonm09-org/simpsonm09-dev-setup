name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: github.repository_owner == 'simpsonm09-org'
    uses: simpsonm09-org/simpsonm09-repo-standard/.github/workflows/lint.yml@aa48730df8b648b4a286f929d134aeb88870106d # repo-standard main
  aislop:
    if: github.repository_owner == 'simpsonm09-org'
    permissions:
      contents: read
      security-events: write
    uses: simpsonm09-org/simpsonm09-repo-standard/.github/workflows/aislop.yml@aa48730df8b648b4a286f929d134aeb88870106d # repo-standard main
  security:
    if: github.repository_owner == 'simpsonm09-org'
    permissions:
      contents: read
      security-events: write
    uses: simpsonm09-org/simpsonm09-repo-standard/.github/workflows/security.yml@aa48730df8b648b4a286f929d134aeb88870106d # repo-standard main

  standard:
    if: github.repository_owner == 'simpsonm09-org'
    permissions:
      contents: read
    uses: simpsonm09-org/simpsonm09-repo-standard/.github/workflows/standard.yml@aa48730df8b648b4a286f929d134aeb88870106d # repo-standard main

  test:
    if: github.repository_owner == 'simpsonm09-org'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      - name: Check the workspace wiring
        run: just test
