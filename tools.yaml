# Machine tools for a Windows + WSL or macOS workspace.
#
# This file is the single hand-edited source of the tool data. scripts/tools.mjs
# renders the per-platform artifacts from it:
#   Brewfile, windows/apps.json, windows/manual-apps.json, wsl/packages.json,
#   tools.generated.json, docs/apps.md, agent-tools.json, docs/agent-tools.md
# Edit this file, then run `just tools-render`. `just tools-check` fails when an
# artifact is stale. `just tools` prints this host's plan. `just tools-ai` prints
# the agent tool set and `just tools-ai-check` checks the agent artifacts.
#
# Schema
#   tools[]        one logical tool per capability
#     id, name, role, kind (app|cli), consumers (human|agent)
#     equivalents  cross-platform stand-ins
#     policy       latest | vendor-auto-update | store-managed | <pinned version>
#     installByDefault, requiresExplicitOptIn, note
#     windows/wsl/macos  optional per-platform realization
#       manager    winget | msstore | scoop | brew | apt | snap | npm | manual
#       id         winget/msstore package id
#       package    scoop/apt/snap/npm package
#       packages   multi-package apt/snap/npm section, as a list
#       classic    snap only; install with --classic
#       formula/cask  brew formula or cask
#       url        manual download page
#       fallback   ordered chain tried when the primary manager lacks the package

version: 1
ubuntuRelease: "26.04"
packagePolicy: "latest from configured apt sources"

tools:
  # WSL base prerequisites. The Windows and macOS hosts ship these already.
  - id: git
    name: Git
    role: Version control
    kind: cli
    consumers:
      - human
      - agent
    wsl:
      manager: apt
      package: git

  - id: curl
    name: curl
    role: HTTP client
    kind: cli
    consumers:
      - human
      - agent
    wsl:
      manager: apt
      package: curl

  - id: ca-certificates
    name: CA certificates
    role: TLS trust store
    kind: cli
    consumers:
      - human
      - agent
    wsl:
      manager: apt
      package: ca-certificates

  - id: unzip
    name: unzip
    role: Archive extraction
    kind: cli
    consumers:
      - human
      - agent
    wsl:
      manager: apt
      package: unzip

  - id: gnupg
    name: GnuPG
    role: Signature and key handling
    kind: cli
    consumers:
      - human
      - agent
    wsl:
      manager: apt
      package: gnupg

  # Applications.
  - id: chrome
    name: Google Chrome
    role: Default development browser
    kind: app
    consumers:
      - human
    policy: vendor-auto-update
    note: Keep Chrome's own security auto-updates; do not freeze a stale browser build.
    windows:
      manager: winget
      id: Google.Chrome
    macos:
      manager: brew
      cask: google-chrome

  - id: github-desktop
    name: GitHub Desktop
    role: Routine Git pull/push UI
    kind: app
    consumers:
      - human
    policy: latest
    windows:
      manager: winget
      id: GitHub.GitHubDesktop
    macos:
      manager: brew
      cask: github

  - id: terminal
    name: Terminal
    role: GPU-accelerated terminal
    kind: app
    consumers:
      - human
    equivalents:
      - noctty
      - ghostty
    policy: latest
    note: Ghostty has no Windows build; Noctty is the Windows stand-in.
    windows:
      manager: winget
      id: AmanThanvi.winghostty
      name: Noctty
      installedAliases:
        - Noctty
    wsl:
      manager: snap
      package: ghostty
      classic: true
    macos:
      manager: brew
      cask: ghostty

  - id: sublime-text
    name: Sublime Text 4
    role: Text editing
    kind: app
    consumers:
      - human
    policy: latest
    windows:
      manager: winget
      id: SublimeHQ.SublimeText.4
    macos:
      manager: brew
      cask: sublime-text

  - id: zed
    name: Zed
    role: IDE
    kind: app
    consumers:
      - human
    policy: latest
    windows:
      manager: winget
      id: ZedIndustries.Zed
    macos:
      manager: brew
      cask: zed

  - id: postman
    name: Postman
    role: API testing
    kind: app
    consumers:
      - human
    policy: latest
    windows:
      manager: winget
      id: Postman.Postman
    macos:
      manager: brew
      cask: postman

  - id: docker
    name: Docker Desktop
    role: Linux containers through WSL2
    kind: app
    consumers:
      - human
      - agent
    policy: latest
    note: Both machines run Docker Engine inside Ubuntu WSL2; Docker Desktop is opt-in only.
    installByDefault: false
    requiresExplicitOptIn: true
    windows:
      manager: winget
      id: Docker.DockerDesktop
    wsl:
      manager: apt
      profile: dockerEngine
      packages:
        - docker-ce
        - docker-ce-cli
        - containerd.io
        - docker-buildx-plugin
        - docker-compose-plugin
    macos:
      manager: brew
      cask: docker-desktop

  - id: onenote
    name: OneNote
    role: Notes; current OneNote app
    kind: app
    consumers:
      - human
    policy: store-managed
    windows:
      manager: msstore
      id: XPFFZHVGQWWLHB

  - id: openchamber
    name: OpenChamber
    role: OpenCode GUI
    kind: app
    consumers:
      - human
    note: No matching winget package; install and update from the official release.
    windows:
      manager: manual
      publisher: OpenChamber
      url: https://github.com/openchamber/openchamber/releases
      observedVersion: "2.0.2"
      installPolicy: manual-official-release

  # Developer CLI tools.
  - id: gh
    name: GitHub CLI
    role: CLI-only GitHub tasks
    kind: cli
    consumers:
      - human
      - agent
    policy: latest
    windows:
      manager: winget
      id: GitHub.cli
      fallback:
        - manager: scoop
          package: gh
    wsl:
      manager: apt
      package: gh
    macos:
      manager: brew
      formula: gh

  - id: kubectl
    name: Kubernetes CLI
    role: Kubernetes objects
    kind: cli
    consumers:
      - human
      - agent
    policy: latest
    windows:
      manager: winget
      id: Kubernetes.kubectl
    macos:
      manager: brew
      formula: kubectl

  - id: helm
    name: Helm
    role: Kubernetes packaging
    kind: cli
    consumers:
      - human
      - agent
    policy: latest
    windows:
      manager: winget
      id: Helm.Helm
    macos:
      manager: brew
      formula: helm

  - id: vault
    name: HashiCorp Vault
    role: Vault secrets
    kind: cli
    consumers:
      - human
      - agent
    policy: latest
    windows:
      manager: winget
      id: Hashicorp.Vault
    macos:
      manager: brew
      formula: vault

  - id: kustomize
    name: Kustomize
    role: Kubernetes manifest rendering
    kind: cli
    consumers:
      - human
      - agent
    policy: latest
    windows:
      manager: winget
      id: Kubernetes.kustomize
    macos:
      manager: brew
      formula: kustomize

  - id: postman-cli
    name: Postman CLI
    role: Postman cloud
    kind: cli
    consumers:
      - human
      - agent
    policy: latest
    windows:
      manager: npm
      package: postman-cli
    wsl:
      manager: npm
      package: postman-cli
    macos:
      manager: npm
      package: postman-cli

  - id: newman
    name: Newman
    role: Postman collection runs
    kind: cli
    consumers:
      - human
      - agent
    policy: latest
    windows:
      manager: npm
      package: newman
    wsl:
      manager: npm
      package: newman
    macos:
      manager: npm
      package: newman

  - id: acli
    name: Atlassian CLI
    role: Jira and Atlassian
    kind: cli
    consumers:
      - human
      - agent
    policy: latest
    windows:
      manager: manual
      url: https://developer.atlassian.com/cloud/acli/
    macos:
      manager: manual
      url: https://developer.atlassian.com/cloud/acli/

  - id: jenkins-cli
    name: Jenkins CLI
    role: Jenkins jobs and builds
    kind: cli
    consumers:
      - human
      - agent
    policy: latest
    note: Download the controller jar from <url>/jnlpJars/jenkins-cli.jar.
    windows:
      manager: manual
      url: https://www.jenkins.io/doc/book/managing/cli/
    macos:
      manager: manual
      url: https://www.jenkins.io/doc/book/managing/cli/

  - id: just
    name: just
    role: Repository tasks
    kind: cli
    consumers:
      - human
      - agent
    policy: latest
    note: Pinned in mise.toml; run mise install in the repository.
    windows:
      manager: manual
      note: Pinned in mise.toml; run mise install in the repository.
    macos:
      manager: manual
      note: Pinned in mise.toml; run mise install in the repository.

  - id: himalaya
    name: Himalaya
    role: Send from the Gmail mailbox
    kind: cli
    consumers:
      - human
      - agent
    policy: latest
    windows:
      manager: scoop
      package: himalaya
      fallback:
        - manager: manual
          url: https://github.com/soywod/himalaya/releases
    macos:
      manager: brew
      formula: himalaya

  - id: ntfy
    name: ntfy
    role: Phone notifications
    kind: cli
    consumers:
      - human
      - agent
    policy: latest
    windows:
      manager: scoop
      package: ntfy
      fallback:
        - manager: manual
          url: https://github.com/binwiederhier/ntfy/releases
    macos:
      manager: brew
      formula: ntfy

  - id: smsgate
    name: SMS Gateway
    role: Texting via an Android phone
    kind: cli
    consumers:
      - human
      - agent
    policy: latest
    windows:
      manager: manual
      url: https://github.com/capcom6/android-sms-gateway/releases
    macos:
      manager: manual
      url: https://github.com/capcom6/android-sms-gateway/releases

  - id: opencode
    name: OpenCode CLI
    role: AI CLI
    kind: cli
    consumers:
      - human
      - agent
    policy: latest
    note: Installed separately from the package bootstrap; credentials stay in local auth storage.
    wsl:
      manager: manual
      note: Install from the official V2 command; credentials stay in local auth storage.
      observedVersion: "2.0.18"
      updateCommand: opencode upgrade

  # Agent and service-owner CLI tools. The service-integrations registry names
  # mise, infisical, trivy, playwright-cli, chrome-devtools, and ctx7.
  - id: mise
    name: mise
    role: Pinned tool versions
    kind: cli
    consumers:
      - human
      - agent
    policy: latest
    note: Installs the versions pinned in mise.toml, including just.
    windows:
      manager: winget
      id: jdx.mise
    wsl:
      manager: manual
      url: https://mise.jdx.dev/installing-mise.html
    macos:
      manager: brew
      formula: mise

  - id: infisical
    name: Infisical CLI
    role: Workspace secrets source
    kind: cli
    consumers:
      - human
      - agent
    policy: latest
    windows:
      manager: npm
      package: "@infisical/cli"
    wsl:
      manager: npm
      package: "@infisical/cli"
    macos:
      manager: npm
      package: "@infisical/cli"

  - id: trivy
    name: Trivy
    role: Dependency, secret, and misconfig scan
    kind: cli
    consumers:
      - human
      - agent
    policy: latest
    windows:
      manager: winget
      id: AquaSecurity.Trivy
    wsl:
      manager: manual
      url: https://trivy.dev/latest/docs/installation/
    macos:
      manager: brew
      formula: trivy

  - id: playwright-cli
    name: Playwright CLI
    role: Browser automation and capture
    kind: cli
    consumers:
      - agent
    policy: latest
    windows:
      manager: npm
      package: "@playwright/cli"
    wsl:
      manager: npm
      package: "@playwright/cli"
    macos:
      manager: npm
      package: "@playwright/cli"

  - id: chrome-devtools
    name: Chrome DevTools CLI
    role: Chrome performance and debugging
    kind: cli
    consumers:
      - agent
    policy: latest
    windows:
      manager: npm
      package: chrome-devtools
    wsl:
      manager: npm
      package: chrome-devtools
    macos:
      manager: npm
      package: chrome-devtools

  - id: ctx7
    name: Context7 CLI
    role: Library documentation context
    kind: cli
    consumers:
      - agent
    policy: latest
    windows:
      manager: npm
      package: ctx7
    wsl:
      manager: npm
      package: ctx7
    macos:
      manager: npm
      package: ctx7
